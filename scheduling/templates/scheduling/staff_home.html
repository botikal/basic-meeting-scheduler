{% extends "scheduling/base.html" %}
{% block title %}Bookings{% endblock %}
{% block content %}
  <header class="head staff-head">
    <div>
      <h1>Bookings</h1>
      <p class="muted">signed in as {{ request.user.get_username }}</p>
    </div>
    <form method="post" action="{% url 'scheduling:staff-logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn--ghost btn--sm">Log out</button>
    </form>
  </header>

  {% include "scheduling/_staff_calendar.html" %}
{% endblock %}
{% block foot %}<a href="{% url 'scheduling:index' %}">Booking page</a>{% endblock %}
